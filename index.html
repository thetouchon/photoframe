<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>PhotoframeApp</title>
<link rel="stylesheet" href="style.css?v=2" />
</head>
<body>
  <main id="screen-select" class="screen">
    <h1 class="select-title">Choose your frame</h1>
    <div class="frame-choices">
      <button class="frame-choice" data-frame="0" aria-label="Frame 1">
        <img src="assets/frame-1.png" alt="Frame 1" draggable="false" />
      </button>
      <button class="frame-choice" data-frame="1" aria-label="Frame 2">
        <img src="assets/frame-2.png" alt="Frame 2" draggable="false" />
      </button>
      <button class="frame-choice" data-frame="2" aria-label="Frame 3">
        <img src="assets/frame-3.png" alt="Frame 3" draggable="false" />
      </button>
      <button class="frame-choice" data-frame="3" aria-label="Frame 4">
        <img src="assets/frame-4.png" alt="Frame 4" draggable="false" />
      </button>
      <button class="frame-choice" data-frame="4" aria-label="Frame 5">
        <img src="assets/frame-5.png" alt="Frame 5" draggable="false" />
      </button>
      <button class="frame-choice" data-frame="5" aria-label="Frame 6">
        <img src="assets/frame-6.png" alt="Frame 6" draggable="false" />
      </button>
    </div>
  </main>

  <main id="screen-camera" class="screen" hidden>
    <div id="editor" class="frame">
      <div id="slots"></div>
      <video id="camera-video" class="live-video" autoplay playsinline muted></video>
      <img id="frame-image" class="frame-image" alt="Photo frame" draggable="false" />
    </div>

    <div id="actions-live" class="actions">
      <button id="btn-snap" class="btn">📷 Snap!</button>
    </div>

    <div id="actions-captured" class="actions" hidden>
      <button id="btn-retake" class="btn">Retake</button>
      <button id="btn-download" class="btn">Download</button>
      <button id="btn-other-frame" class="btn">Try Other Frame</button>
    </div>

    <input id="file-input-camera" type="file" accept="image/*" capture="user" hidden />
  </main>

  <script src="app.js?v=2"></script>
</body>
</html>
